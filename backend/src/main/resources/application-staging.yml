# Staging: production-like, synthetic or masked data only. All secrets via environment/secret manager.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}

server:
  forward-headers-strategy: framework

logging:
  structured:
    format:
      console: ecs
