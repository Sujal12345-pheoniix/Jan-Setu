# Shared configuration. Environment-specific values live in application-<profile>.yml.
# All secrets and environment-specific endpoints come from environment variables.
spring:
  application:
    name: jansetu-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jansetu}
    username: ${DB_USERNAME:jansetu}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-http-form-post-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: JanSetu
    description: Portfolio simulation - not an official government portal.

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: INFO
    com.jansetu: INFO

jansetu:
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://jansetu.local}
      audience: ${JWT_AUDIENCE:jansetu-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      # PEM-encoded RSA keys (PKCS#8 private, X.509 public). Required outside local/test.
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
      allow-ephemeral-keys: false
    refresh:
      ttl: ${REFRESH_TOKEN_TTL:P7D}
      cookie-name: jansetu_rt
      cookie-path: /api/v1/auth
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    password-reset:
      ttl: PT30M
      reset-url-base: ${APP_BASE_URL:http://localhost:5173}/reset-password
    login-protection:
      max-failed-attempts: 5
      lock-duration: PT15M
    rate-limit:
      enabled: true
      auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    log-body: false
  storage:
    # Private directory for uploaded documents (outside any web root). Use object storage in shared deployments.
    local-dir: ${DOCUMENT_STORAGE_DIR:./storage/documents}
  seed:
    enabled: false
    demo-password: ${SEED_DEMO_PASSWORD:}
